[project]
name = "shrug-fm-causal-benchmark"
version = "0.1.0"
description = "Synthetic causal measurement-error experiments for SHRUG-FM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "rasterio>=1.4.4",
]

[project.optional-dependencies]
encoder = [
    "pyyaml>=6,<7",
    "timm>=1.0,<2",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
]

[tool.uv]
package = false
cache-dir = ".uv-cache"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
